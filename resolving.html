<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolving…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111113;
      --surface: #1a1a1e;
      --border:  #2a2a30;
      --text:    #ffffff;
      --muted:   #6b6b78;
      --orange:  #f97316;
      --orange-dim: rgba(249,115,22,0.12);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .page {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Header ── */
    .header { text-align: center; }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
      transition: opacity 0.3s;
    }
    .spinner.done { opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .check-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--orange-dim);
      border: 2px solid var(--orange);
      display: none;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 22px;
      animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .check-icon.visible { display: flex; }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Source chip ── */
    .source-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .chip-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex-shrink: 0;
    }
    .chip-url {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, monospace;
    }

    /* ── Progress ── */
    .progress-wrap { display: flex; flex-direction: column; gap: 8px; }
    .progress-track {
      height: 2px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--orange);
      border-radius: 99px;
      transition: width 0.1s linear;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Result panel ── */
    .result { display: flex; flex-direction: column; gap: 16px; }

    .final-url-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .final-url-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .final-url-text {
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.55;
      font-family: ui-monospace, monospace;
    }

    /* ── Variant buttons ── */
    .variants { display: flex; flex-direction: column; gap: 10px; }

    .variant-btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
    }
    .variant-btn:hover {
      border-color: var(--orange);
      background: var(--orange-dim);
    }
    .variant-btn.primary {
      background: var(--orange);
      border-color: var(--orange);
    }
    .variant-btn.primary:hover { opacity: 0.9; }

    .variant-left { flex: 1; min-width: 0; }
    .variant-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .variant-btn.primary .variant-name { color: #fff; }
    .variant-desc {
      font-size: 12px;
      color: var(--muted);
    }
    .variant-btn.primary .variant-desc { color: rgba(255,255,255,0.7); }

    .variant-arrow {
      font-size: 16px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .variant-btn.primary .variant-arrow { color: #fff; }
    .variant-btn:hover .variant-arrow { color: var(--orange); }
    .variant-btn.primary:hover .variant-arrow { color: #fff; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="spinner" id="spinner"></div>
      <div class="check-icon" id="check-icon">✓</div>
      <h1 id="headline">Resolving link…</h1>
      <p class="subtitle" id="subtitle">Following the redirect chain</p>
    </div>

    <div class="source-chip">
      <span class="chip-label">From</span>
      <span class="chip-url" id="source-url">—</span>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progress-status">Initialising…</span>
        <span id="progress-time">0.0s</span>
      </div>
    </div>

    <div class="result" id="result" style="display:none">
      <div class="final-url-box">
        <div class="final-url-label">Resolved URL</div>
        <div class="final-url-text" id="final-url-text"></div>
      </div>
      <div class="variants" id="variants"></div>
    </div>
  </div>

  <script src="resolving.js"></script>
</body>
</html>
